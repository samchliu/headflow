name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter=@headflow/core --filter=@headflow/solid

      - name: Install Playwright browsers
        run: pnpm --filter=@headflow/core exec playwright install --with-deps chromium
        continue-on-error: true  # browser tests are optional in CI for now

      - name: Unit tests (core)
        run: pnpm --filter=@headflow/core test
        continue-on-error: true

      - name: Unit tests (solid)
        run: pnpm --filter=@headflow/solid test
        continue-on-error: true

      - name: Build stress-test
        run: pnpm --filter=@headflow/stress-test build

  perf-test:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter=@headflow/core --filter=@headflow/solid

      - name: Build stress-test app
        run: pnpm --filter=@headflow/stress-test build

      - name: Install Playwright browsers
        run: pnpm --filter=@headflow/stress-test exec playwright install --with-deps chromium

      - name: Run performance benchmarks
        run: pnpm --filter=@headflow/stress-test test:perf
